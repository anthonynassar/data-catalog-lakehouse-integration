[project]
name = "collibra-semantic-model"
version = "0.1.0"
description = "Generate Snowflake semantic model YAML files enriched with Collibra metadata."
authors = [{name = "Data Catalog Team"}]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-mock>=3.12",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra"
testpaths = ["tests"]
